[pytest]
# Windows LuaJIT uses SEH 0xe24c4a02 for caught Lua errors. CPython's
# faulthandler prints each of these as "fatal" before LuaJIT catches it.
# Assertions and process exit status still fail the test run normally.
# Source: https://github.com/LuaJIT/LuaJIT/blob/v2.1/src/lj_err.c
addopts = -p no:faulthandler
